<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #800020;
            --secondary: #D4AF37;
            --bg-color: #F9F6F0;
            --card-bg: #FFFFFF;
            --text-color: #2C2C2C;
            --border-color: #E5E7EB;
        }
        [data-theme="dark"] {
            --primary: #9B111E;
            --secondary: #E5C158;
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-color: #F9F6F0;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        nav { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-area h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--secondary); font-weight: 700; }
        .nav-controls { display: flex; align-items: center; gap: 12px; }
        .btn-control { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .btn-admin { background: var(--primary); color: white; border-color: var(--primary); }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1599661046289-e31898746a56?auto=format&fit=crop&w=1200&q=80') center/cover; color: #fff; text-align: center; padding: 110px 20px; margin-bottom: 40px; }
        .hero h2 { font-size: 3rem; margin-bottom: 15px; color: var(--secondary); font-family: 'Playfair Display', serif; }
        .hero p { font-size: 1.2rem; max-width: 700px; margin: 0 auto; color: #f1f1f1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h3 { font-size: 2rem; color: var(--primary); position: relative; display: inline-block; padding-bottom: 10px; }
        .section-title h3::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background: var(--secondary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .product-img { height: 200px; background-size: cover; background-position: center; }
        .product-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; align-self: flex-start; background: #fef3c7; color: #92400e; }
        .product-body h4 { font-size: 1.2rem; margin-bottom: 8px; }
        .product-body p { font-size: 0.9rem; color: #777; flex-grow: 1; }
        footer { background: var(--card-bg); border-top: 1px solid var(--border-color); text-align: center; padding: 30px; margin-top: 50px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area"><h1 id="site-logo-text">Kashmir Store</h1></div>
        <div class="nav-controls">
            <button class="btn-control" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> <span>الوضع الليلي</span></button>
        </div>
    </nav>

    <section class="hero" id="hero-section">
        <h2 id="hero-title">Kashmir Store</h2>
        <p id="hero-subtitle">وجهتك الأولى لتسوق أرقى التحف اليدوية، المنسوجات التراثية، والمشغولات الشرقية الأصيلة.</p>
    </section>

    <div class="container">
        <div class="section-title"><h3>معروضات البزار المتميزة</h3></div>
        <div class="products-grid" id="products-container">
            <p style="text-align: center; grid-column: span 100;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026</p>
        <p id="footer-contact" style="margin-top: 8px; font-size: 0.9rem; color: #777;">الهاتف: 01000000000 | العنوان: مصر</p>
    </footer>

    <script>
        async function loadStoreData() {
            try {
                // جلب المنتجات والبيانات مباشرة من ملف data.json سحابياً
                const res = await fetch('data.json?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('site-logo-text').innerText = data.logoText;
                document.getElementById('hero-title').innerText = data.title;
                document.getElementById('hero-subtitle').innerText = data.subtitle;
                document.getElementById('footer-contact').innerText = `الهاتف: ${data.phone} | العنوان: ${data.address}`;

                const container = document.getElementById('products-container');
                container.innerHTML = '';
                
                if(data.products.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: span 100;">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                data.products.forEach(p => {
                    container.innerHTML += `
                        <div class="product-card">
                            <div class="product-img" style="background-image: url('${p.img}')"></div>
                            <div class="product-body">
                                <span class="product-badge">${p.category}</span>
                               <h4>${p.name}</h4>
                                <p>${p.desc}</p>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('products-container').innerHTML = '<p style="text-align: center; color: red;">تعسّر تحميل البيانات، تأكد من وجود ملف data.json</p>';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        loadStoreData();
    </script>
</body>
</html>
